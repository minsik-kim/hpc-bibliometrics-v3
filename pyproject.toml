[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-bibliometrics-v3"
version = "0.1.0"
description = "Fast bibliometric analysis for HPC conferences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "polars>=1.0",
  "pyarrow>=16",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hpc-bib = "hpc_bibliometrics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_bibliometrics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
