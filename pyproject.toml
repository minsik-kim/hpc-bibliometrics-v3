[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-bibliometrics-v3"
version = "0.1.0"
description = "Fast, reproducible bibliometric analysis for HPC conferences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "polars>=1.0,<2",
  "truststore>=0.9,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
hpc-bib = "hpc_bibliometrics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_bibliometrics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
